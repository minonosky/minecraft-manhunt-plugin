name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: bash ./mvnw --batch-mode verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-plugin
          path: target/manhunt-plugin-*.jar
          if-no-files-found: error
